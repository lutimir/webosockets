# Load balancer for two SyncKit API instances. No sticky sessions needed:
# WebSocket connections pin themselves to whichever instance accepted them,
# and cross-instance fan-out goes through Redis pub/sub (verified by the
# chaos + multi-instance test suites).
worker_processes auto;

events {
  worker_connections 4096;
}

http {
  upstream synckit_api {
    least_conn;
    server server-a:4000 max_fails=3 fail_timeout=10s;
    server server-b:4000 max_fails=3 fail_timeout=10s;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  server {
    listen 8080;

    location / {
      proxy_pass http://synckit_api;
      proxy_http_version 1.1;

      # WebSocket upgrade for /v1/realtime (harmless for plain HTTP).
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Long-lived realtime connections; server pings every 30 s.
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
    }

    # Never expose the internal/metrics planes through the public LB.
    location /internal/ { return 403; }
    location /metrics { return 403; }
  }
}
