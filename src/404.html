<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Stránka nenájdená</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #16213e;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            overflow: hidden;
        }
        .container {
            position: relative;
            z-index: 1;
        }
        .code {
            font-size: 8rem;
            font-weight: 900;
            letter-spacing: 0.1em;
            line-height: 1;
            margin-bottom: 0.2em;
        }
        .code span:nth-child(1) { color: #e74c3c; }
        .code span:nth-child(2) { color: #fff; }
        .code span:nth-child(3) { color: #3498db; }
        .stone {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #e74c3c;
            border: 4px solid #c0392b;
            margin: 1.5rem auto;
            position: relative;
            animation: roll 3s ease-in-out infinite;
        }
        .stone::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #16213e;
            border: 2px solid #c0392b;
        }
        @keyframes roll {
            0%, 100% { transform: translateX(-80px) rotate(0deg); }
            50% { transform: translateX(80px) rotate(360deg); }
        }
        h2 {
            font-size: 1.5rem;
            font-weight: 400;
            color: rgba(255,255,255,0.7);
            margin-bottom: 2rem;
        }
        .btn {
            display: inline-block;
            padding: 12px 32px;
            background: #3498db;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn:hover { background: #2980b9; }
        .rings {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.04;
        }
        .rings circle {
            fill: none;
            stroke: #fff;
            stroke-width: 2;
        }
    </style>
</head>
<body>
    <svg class="rings" width="600" height="600" viewBox="0 0 600 600">
        <circle cx="300" cy="300" r="280"/>
        <circle cx="300" cy="300" r="200"/>
        <circle cx="300" cy="300" r="120"/>
        <circle cx="300" cy="300" r="40" fill="rgba(255,255,255,0.03)"/>
    </svg>
    <div class="container">
        <div class="code"><span>4</span><span>0</span><span>4</span></div>
        <div class="stone"></div>
        <h2>Kameň sa stratil mimo hraciu plochu</h2>
        <a href="/zadanie3/curling/" class="btn">Späť na hru</a>
    </div>
</body>
</html>
